<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>인터벌 타이머</title>
<meta name="description" content="유튜브 보면서 쓰는 심플 인터벌 운동 타이머">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="인터벌">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏱️</text></svg>">
</head>
<body data-phase="idle">

<main class="app">

  <!-- ============ 설정 화면 ============ -->
  <section id="setup" class="screen">
    <header class="top">
      <h1>⏱️ 인터벌 타이머</h1>
      <p class="sub">설정하고 유튜브 틀어놓고 운동하세요 — 소리가 타이밍을 알려줍니다</p>
    </header>


    <form id="form" autocomplete="off">
      <div class="field" data-phasecolor="prepare">
        <label for="prepare">준비 (초)</label>
        <div class="stepper">
          <button type="button" class="step" data-for="prepare" data-d="-5">−</button>
          <input id="prepare" type="number" inputmode="numeric" min="0" max="300" step="5" value="10">
          <button type="button" class="step" data-for="prepare" data-d="5">+</button>
        </div>
      </div>

      <div class="field" data-phasecolor="work" id="workField">
        <label for="work">운동 (초)</label>
        <div class="stepper">
          <button type="button" class="step" data-for="work" data-d="-5">−</button>
          <input id="work" type="number" inputmode="numeric" min="5" max="3600" step="5" value="30">
          <button type="button" class="step" data-for="work" data-d="5">+</button>
        </div>
      </div>

      <div class="field" data-phasecolor="rest">
        <label for="rest">휴식 (초)</label>
        <div class="stepper">
          <button type="button" class="step" data-for="rest" data-d="-5">−</button>
          <input id="rest" type="number" inputmode="numeric" min="0" max="3600" step="5" value="15">
          <button type="button" class="step" data-for="rest" data-d="5">+</button>
        </div>
      </div>

      <div class="field">
        <label for="rounds">라운드</label>
        <div class="stepper">
          <button type="button" class="step" data-for="rounds" data-d="-1">−</button>
          <input id="rounds" type="number" inputmode="numeric" min="1" max="99" step="1" value="8">
          <button type="button" class="step" data-for="rounds" data-d="1">+</button>
        </div>
      </div>

      <div class="field">
        <label for="sets">세트</label>
        <div class="stepper">
          <button type="button" class="step" data-for="sets" data-d="-1">−</button>
          <input id="sets" type="number" inputmode="numeric" min="1" max="20" step="1" value="1">
          <button type="button" class="step" data-for="sets" data-d="1">+</button>
        </div>
      </div>

      <div class="field" data-phasecolor="setrest" id="setrestField">
        <label for="setrest">세트 간 휴식 (초)</label>
        <div class="stepper">
          <button type="button" class="step" data-for="setrest" data-d="-10">−</button>
          <input id="setrest" type="number" inputmode="numeric" min="0" max="3600" step="10" value="60">
          <button type="button" class="step" data-for="setrest" data-d="10">+</button>
        </div>
      </div>
    </form>

    <div class="total">총 운동 시간 <strong id="totalTime">-</strong></div>
    <button id="startBtn" class="big-btn">시작</button>

    <div class="ex-section">
      <div class="ex-head">
        <label>운동 구성 (선택)</label>
        <span class="ex-hint">비워두면 모든 구간이 "운동"으로 표시됩니다</span>
      </div>
      <div id="exList"></div>
      <div class="ex-add">
        <input id="exName" type="text" placeholder="직접 입력 (예: 케틀벨 스윙)" maxlength="20">
        <button type="button" id="exAddBtn" class="mini wide">추가</button>
      </div>
      <div class="ex-chips" id="exChips"></div>
      <p class="ex-note">1라운드 = 목록 전체를 순서대로 1회 (운동 사이에 휴식)</p>
    </div>

    <div class="ex-section" id="routineSection">
      <div class="ex-head">
        <label>내 루틴</label>
        <span class="rt-btns">
          <button type="button" id="routineSaveBtn" class="mini wide">현재 구성 저장</button>
          <button type="button" id="routineSaveNewBtn" class="mini wide" hidden>새로 저장</button>
        </span>
      </div>
      <div id="routineList"></div>
      <p class="ex-note" id="routineEmpty">저장된 루틴이 없습니다 — 구성을 만든 뒤 "현재 구성 저장"을 누르세요</p>
    </div>

    <div class="ex-section" id="histSection">
      <div class="ex-head">
        <label>운동 기록</label>
        <span class="hist-stats" id="histStats"></span>
      </div>
      <div class="cal-head">
        <button type="button" class="mini" id="calPrev">‹</button>
        <span id="calTitle"></span>
        <button type="button" class="mini" id="calNext">›</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div id="dayDetail"></div>
    </div>



    <div class="options">
      <label class="opt"><input type="checkbox" id="optSound" checked> 🔔 효과음</label>
      <label class="opt"><input type="checkbox" id="optVoice" checked> 🗣️ 음성 안내</label>
      <label class="opt"><input type="checkbox" id="optWake" checked> ☀️ 화면 켜짐 유지</label>
    </div>
  </section>

  <!-- ============ 타이머 화면 ============ -->
  <section id="run" class="screen" hidden>
    <div class="run-head">
      <span id="setLabel" class="pill"></span>
      <span id="roundLabel" class="pill"></span>
      <span id="exLabel" class="pill"></span>
    </div>

    <div class="ring-wrap">
      <svg class="ring" viewBox="0 0 100 100">
        <circle class="ring-bg" cx="50" cy="50" r="45"/>
        <circle class="ring-fg" id="ringFg" cx="50" cy="50" r="45"/>
      </svg>
      <div class="ring-center">
        <div id="phaseLabel" class="phase-label">준비</div>
        <div id="timeLabel" class="time-label">10</div>
        <div id="nextLabel" class="next-label"></div>
      </div>
    </div>

    <div class="progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="elapsed"><span id="elapsedLabel">0:00</span> / <span id="totalLabel">0:00</span></div>

    <div class="controls">
      <button id="prevBtn" class="ctl" title="이전 (←)">⏮</button>
      <button id="pauseBtn" class="ctl main" title="일시정지 (Space)">⏸</button>
      <button id="nextBtn" class="ctl" title="다음 (→)">⏭</button>
    </div>
    <button id="stopBtn" class="stop-btn">정지</button>
    <p class="hint">화면을 탭하면 일시정지 / 재개</p>
  </section>


  <!-- ============ 완료 요약 화면 ============ -->
  <section id="done" class="screen" hidden>
    <div class="done-hero">
      <div class="done-emoji">🎉</div>
      <h2>운동 완료!</h2>
      <p class="done-sub" id="doneStreak"></p>
    </div>
    <div class="done-card">
      <div class="done-row"><span>루틴</span><strong id="doneName"></strong></div>
      <div class="done-row"><span>총 시간</span><strong id="doneTotal"></strong></div>
      <div class="done-row"><span>운동 시간</span><strong id="doneWork"></strong></div>
      <div class="done-row"><span>휴식 시간</span><strong id="doneRest"></strong></div>
      <div class="done-row"><span>구성</span><strong id="doneConfig"></strong></div>
      <div class="done-row"><span>완료 시각</span><strong id="doneAt"></strong></div>
    </div>
    <button type="button" id="doneBtn" class="big-btn">완료</button>
    <button type="button" id="againBtn" class="big-btn ghost">한 번 더</button>
  </section>

  <div id="toast" role="status"></div>
</main>

<script src="app.js"></script>
</body>
</html>
